<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Sequence Generator{% endblock %}</title>
  <meta name="description"
    content="Production-quality agentic AI outbound email sequence generator with LangGraph, RAG, and human approval." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* ─── Design Tokens ─── */
    :root {
      --bg: #08090d;
      --surface: #0f1117;
      --surface-2: #161821;
      --surface-3: #1e2030;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(99, 102, 241, 0.30);
      --text: #e4e6f0;
      --text-muted: #6b7094;
      --primary: #6366f1;
      --primary-h: #818cf8;
      --primary-glow: rgba(99, 102, 241, 0.15);
      --success: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.12);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.10);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.10);
      --radius: 12px;
      --radius-lg: 16px;
      --shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.45);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Reset ─── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ─── Subtle bg grain ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99, 102, 241, 0.06), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.04), transparent);
      pointer-events: none;
    }

    /* ─── Nav ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 9, 13, 0.75);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.3s var(--ease);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .nav-brand .dot {
      width: 7px;
      height: 7px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary), 0 0 20px rgba(99, 102, 241, 0.3);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .5;
        transform: scale(0.8);
      }
    }

    .nav-links {
      display: flex;
      gap: 2px;
    }

    .nav-link {
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.2s var(--ease);
      position: relative;
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-link.active {
      color: var(--text);
      background: rgba(99, 102, 241, 0.08);
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* ─── Layout ─── */
    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ─── Cards ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    .card-glow {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.08), var(--shadow);
    }

    .card-glow:hover {
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.15), 0 4px 24px rgba(99, 102, 241, 0.08);
    }

    /* ─── Badges ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .badge-pending {
      background: var(--warning-glow);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.18);
    }

    .badge-approved {
      background: var(--success-glow);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.18);
    }

    .badge-rejected {
      background: var(--danger-glow);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.18);
    }

    .badge-error {
      background: var(--danger-glow);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.18);
    }

    .badge-failed {
      background: var(--danger-glow);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.18);
    }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 20px;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s var(--ease);
      text-decoration: none;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.2s var(--ease);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
    }

    .btn:hover::after {
      opacity: 1;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.30);
    }

    .btn-primary:hover {
      background: var(--primary-h);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.40);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
      box-shadow: 0 2px 12px rgba(34, 197, 94, 0.25);
    }

    .btn-success:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.35);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 2px 12px rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary-h);
      background: rgba(99, 102, 241, 0.04);
    }

    .btn-lg {
      padding: 12px 28px;
      font-size: 0.9rem;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ─── Forms ─── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .form-control {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease), background 0.2s var(--ease);
      width: 100%;
    }

    .form-control::placeholder {
      color: var(--text-muted);
      opacity: 0.5;
    }

    .form-control:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
      background: rgba(99, 102, 241, 0.02);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 90px;
    }

    /* ─── Score Ring ─── */
    .score-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .score-ring svg {
      transform: rotate(-90deg);
    }

    .score-ring .score-text {
      position: absolute;
      text-align: center;
      font-weight: 800;
      font-size: 1.5rem;
    }

    .score-ring .score-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    /* ─── Stat Grid ─── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.15rem;
      transition: border-color 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat-value {
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: 4px;
    }

    /* ─── Table ─── */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    thead th {
      padding: 11px 16px;
      text-align: left;
      background: var(--surface-2);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s var(--ease);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(99, 102, 241, 0.03);
    }

    td {
      padding: 11px 16px;
      color: var(--text);
      vertical-align: middle;
    }

    /* ─── Misc ─── */
    .mono {
      font-family: var(--mono);
      font-size: 0.82em;
    }

    .email-body {
      font-family: var(--font);
      font-size: 0.88rem;
      line-height: 1.75;
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      color: var(--text);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .text-muted {
      color: var(--text-muted);
    }

    .text-success {
      color: var(--success);
    }

    .text-danger {
      color: var(--danger);
    }

    .text-warning {
      color: var(--warning);
    }

    .text-primary {
      color: var(--primary);
    }

    .mt-1 {
      margin-top: 0.5rem;
    }

    .mt-2 {
      margin-top: 1rem;
    }

    .mt-3 {
      margin-top: 1.5rem;
    }

    .mt-4 {
      margin-top: 2rem;
    }

    .mb-2 {
      margin-bottom: 1rem;
    }

    .mb-4 {
      margin-bottom: 2rem;
    }

    .flex {
      display: flex;
    }

    .items-center {
      align-items: center;
    }

    .gap-2 {
      gap: 0.75rem;
    }

    .gap-3 {
      gap: 1.25rem;
    }

    .justify-between {
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 700px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      main {
        padding: 1.5rem 1rem;
      }

      nav {
        padding: 0 1rem;
      }
    }

    /* ─── Spinner ─── */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── Alert ─── */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.84rem;
    }

    .alert-success {
      background: var(--success-glow);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: var(--success);
    }

    .alert-danger {
      background: var(--danger-glow);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .alert-info {
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.15);
      color: var(--primary-h);
    }

    /* ─── Hero gradient line ─── */
    .gradient-line {
      height: 2px;
      background: linear-gradient(90deg, var(--primary), #a855f7, #ec4899, var(--primary));
      background-size: 200% 100%;
      animation: gradient-shift 4s linear infinite;
      border-radius: 999px;
      opacity: 0.7;
    }

    @keyframes gradient-shift {
      to {
        background-position: 200% 0;
      }
    }

    /* ─── Page enter animation ─── */
    main {
      animation: fadeUp 0.35s var(--ease);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* ─── Selection ─── */
    ::selection {
      background: rgba(99, 102, 241, 0.25);
      color: var(--text);
    }
  </style>
  {% block head %}{% endblock %}
</head>

<body>
  <nav>
    <a href="/" class="nav-brand">
      <span class="dot"></span>
      Agentic Outreach System
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="/generate" class="nav-link {% if request.url.path == '/generate' %}active{% endif %}">Generate</a>
      <a href="/logs" class="nav-link {% if request.url.path == '/logs' %}active{% endif %}">Audit Logs</a>
      <a href="/docs" class="nav-link" target="_blank">API Docs</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>

</html>
