version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash-lite}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-company_knowledge}
      - DATABASE_URL=sqlite+aiosqlite:////data/sequence_generator.db
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MIN_SCORE_THRESHOLD=${MIN_SCORE_THRESHOLD:-7.0}
      - MAX_REVISION_CYCLES=${MAX_REVISION_CYCLES:-3}
    volumes:
      - app_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/readyz" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app_data:
  qdrant_data:
